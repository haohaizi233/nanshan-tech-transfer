components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tech-transfer-session-token
      description: accessToken（JWT HS256），由 POST /auth/bootstrap 或 POST /auth/refresh 签发，有效期 2 小时；过期返回 401 TT_COMMON_40102，前端静默 POST /auth/refresh 一次，仍失败重走 bootstrap。

  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
      description: 链路 ID（ULID）。客户端传则透传；服务端必生成并回写响应。日志/审计全部关联。
    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
      description: |
        幂等键（ULID），有效期 24h。同键同体返回首次结果；同键异体 409 TT_IDEM_40901。
        仅 6 个创建类接口必填（前端统一注入）：POST /achievements、POST /demands、POST /cooperations、
        POST /ai/match-tasks、POST /ai/evaluation-tasks、POST /uploads/presign。
        其余写操作不要求：状态流转由状态机校验保证幂等，PUT/DELETE/PATCH 天然幂等，
        POST /auth/* 由唯一约束兜底，POST /uploads/{uploadId}/complete 由 uploadId 兜底。
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 64 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    FavoriteTargetType:
      name: targetType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FavoriteTargetType'
    FavoriteTargetId:
      name: targetId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 参数校验失败（TT_COMMON_40001 / TT_COOP_40001 / TT_ADMIN_40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 会话凭证缺失/无效/过期（TT_COMMON_40101 缺失或无效 / TT_COMMON_40102 过期——前端静默 refresh 一次后重走 bootstrap）。仅用于携带 accessToken 的受保护接口。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BootstrapCredentialInvalid:
      description: 宿主凭证无效（TT_AUTH_40103）。仅用于 POST /auth/bootstrap 与 POST /auth/refresh——会话尚未建立，错误属于宿主凭证/刷新令牌校验阶段，与会话级 40101/40102 分域。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但无权限（TT_COMMON_40301 / TT_ACH_40301 / TT_DMD_40301 / TT_COOP_40301 / TT_AI_40301 / TT_ADMIN_40301）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或不可见（TT_COMMON_40401 / TT_ACH_40401 / TT_DMD_40401 / TT_COOP_40401 / TT_FAV_40401 / TT_AI_40401 / TT_PATENT_40401 / TT_FILE_40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态机冲突 / 乐观锁冲突 / 幂等冲突 / 活跃意向冲突（TT_*_40901 / TT_COMMON_40902 / TT_IDEM_40901 / TT_COOP_40902 / TT_FILE_40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 限流（TT_COMMON_42901 / TT_AI_42901），响应含 Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: 服务内部错误（TT_COMMON_50001），响应不含堆栈与 SQL 细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 外部能力未配置或熔断（TT_AI_50301 / TT_PATENT_50301 / TT_FILE_50301）；AI Provider 失败为 502 TT_AI_50201
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SuccessEnvelope:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          examples: ["ok"]
        data: {}
        requestId:
          type: string
          description: 本次请求链路 ID（ULID）
    ErrorEnvelope:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: 稳定业务错误码（前端唯一分支依据），如 TT_DEMAND_40901
          examples: ["TT_DEMAND_40901"]
        message:
          type: string
          description: 人类可读描述（文案可变，前端禁止解析）
        details:
          description: 结构化补充，如乐观锁冲突返回服务端当前 version
        requestId:
          type: string
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
    BootstrapResult:
      type: object
      required: [accessToken, refreshToken, expiresIn, user, isNewUser]
      properties:
        accessToken:
          type: string
          description: 会话访问令牌（JWT HS256，有效期 2h，后续请求放 Authorization Bearer 头）
        refreshToken:
          type: string
          description: 刷新令牌（JWT HS256 + jti，有效期 14d，服务端 auth_session 可吊销；刷新时轮换）
        expiresIn:
          type: integer
          description: accessToken 有效期（秒），固定 7200
        user:
          $ref: '#/components/schemas/UserProfile'
        isNewUser:
          type: boolean
          description: 本次 bootstrap 是否首次建档（外部身份首次映射）
    UserProfile:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        userNo: { type: string }
        displayName:
          type: [string, 'null']
          description: 为 null 时前端显示"未填写"；禁止用机器身份标识替代
        userType:
          type: [string, 'null']
          enum: [enterprise_staff, researcher, investor, service_org, other, null]
        phone:
          type: [string, 'null']
        email:
          type: [string, 'null']
        orgId: { type: [integer, 'null'], format: int64 }
        orgName: { type: [string, 'null'] }
        orgTitle: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [user, admin] }
    ProfileUpdateRequest:
      type: object
      required: [version]
      properties:
        displayName: { type: string, maxLength: 64 }
        userType: { type: string, enum: [enterprise_staff, researcher, investor, service_org, other] }
        phone: { type: string, maxLength: 32 }
        email: { type: string, maxLength: 128 }
        orgId: { type: integer, format: int64 }
        orgTitle: { type: string, maxLength: 64 }
        version: { type: integer, minimum: 1 }
    AchievementStatus:
      type: string
      enum: [draft, pending_review, published, rejected, offline]
    DemandStatus:
      type: string
      enum: [draft, pending_review, published, rejected, matched, closed, cancelled]
    CooperationStatus:
      type: string
      enum: [pending, accepted, rejected, confirmed, completed, cancelled]
    AiTaskStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    MaturityLevel:
      type: string
      description: 成熟度结构化枚举（详见 05 §3.1）
      enum: ['01_idea', '02_lab', '03_pilot_ready', '04_pilot_done', '05_mass_ready']
    PricingMode:
      type: string
      enum: [negotiable, license, transfer, cooperation, other]
    FavoriteTargetType:
      type: string
      enum: [achievement, demand]
    PatentType:
      type: string
      enum: [invention, utility_model, design]
    PatentLegalStatus:
      type: string
      enum: [valid, invalid, pending, expired, unknown]
    AchievementSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        orgName: { type: [string, 'null'] }
        categoryName: { type: [string, 'null'] }
        maturityLevel: { $ref: '#/components/schemas/MaturityLevel' }
        maturityDesc: { type: [string, 'null'] }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        priceMinWan: { type: [number, 'null'] }
        priceMaxWan: { type: [number, 'null'] }
        applicationFields:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/AchievementStatus' }
        isMine: { type: boolean }
        viewCount: { type: integer }
        publishedAt: { type: [string, 'null'], format: date-time }
    AchievementDetail:
      allOf:
        - $ref: '#/components/schemas/AchievementSummary'
        - type: object
          properties:
            version: { type: integer }
            rejectReason:
              type: [string, 'null']
              description: 最近一次驳回原因（owner 重新编辑提示用；仅 owner/admin 可见）
            techIntro: { type: [string, 'null'] }
            techRoute: { type: [string, 'null'] }
            innovationPoints:
              type: array
              items: { type: string }
            inventors:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  orgName: { type: [string, 'null'] }
                  personType: { type: string, enum: [first_inventor, co_inventor, team_member] }
                  sortOrder: { type: integer }
            contactName: { type: [string, 'null'] }
            contactTitle: { type: [string, 'null'] }
            contactPhone:
              type: [string, 'null']
              description: 脱敏掩码（138****1111）或完整号（权限内）
            contactEmail: { type: [string, 'null'] }
            contactWechat: { type: [string, 'null'] }
            patents:
              type: array
              items:
                $ref: '#/components/schemas/PatentSummary'
            latestEvaluation:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AchievementEvaluation'
    AchievementUpsertRequest:
      type: object
      required: [title, maturityLevel, pricingMode]
      description: 创建与编辑共用；编辑时 version 必填。请求体不得包含 ownerUserId（服务端注入）。
      properties:
        title: { type: string, maxLength: 200 }
        categoryId: { type: integer, format: int64 }
        orgId: { type: integer, format: int64 }
        techIntro: { type: string }
        techRoute: { type: string }
        maturityLevel: { $ref: '#/components/schemas/MaturityLevel' }
        maturityDesc: { type: string, maxLength: 255 }
        applicationFields:
          type: array
          items: { type: string }
        innovationPoints:
          type: array
          items: { type: string }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        priceMinWan: { type: number }
        priceMaxWan: { type: number }
        contactName: { type: string, maxLength: 64 }
        contactTitle: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        contactEmail: { type: string, maxLength: 128 }
        contactWechat: { type: string, maxLength: 64 }
        tags:
          type: array
          items: { type: string }
        inventorRefs:
          type: array
          description: 结构化完成人（禁止"姓名1、姓名2"合并字段）
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 64 }
              orgName: { type: string, maxLength: 128 }
              personType: { type: string, enum: [first_inventor, co_inventor, team_member] }
              sortOrder: { type: integer }
        mediaFileIds:
          type: array
          items: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
    DemandSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        orgName: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        coopMode:
          type: array
          items: { type: string }
        budgetMinWan: { type: [number, 'null'] }
        budgetMaxWan: { type: [number, 'null'] }
        budgetNegotiable: { type: boolean }
        deadlineDesc: { type: [string, 'null'] }
        categoryName: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/DemandStatus' }
        isMine: { type: boolean }
        publishedAt: { type: [string, 'null'], format: date-time }
    DemandDetail:
      allOf:
        - $ref: '#/components/schemas/DemandSummary'
        - type: object
          properties:
            version: { type: integer }
            rejectReason:
              type: [string, 'null']
              description: 最近一次驳回原因（owner 重新编辑提示用；仅 owner/admin 可见）
            description: { type: string }
            expectDeadline: { type: [string, 'null'], format: date }
            orgIntro: { type: [string, 'null'] }
            contactName: { type: [string, 'null'] }
            contactTitle: { type: [string, 'null'] }
            contactPhone: { type: [string, 'null'] }
            contactEmail: { type: [string, 'null'] }
            contactWechat: { type: [string, 'null'] }
    DemandUpsertRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, maxLength: 200 }
        categoryId: { type: integer, format: int64 }
        orgId: { type: integer, format: int64 }
        orgName:
          type: string
          maxLength: 128
          description: 过渡期便捷字段——按名称 get-or-create organization 并写入 orgId（与 orgId 同传时以 orgName 解析结果为准）
        orgIntro:
          type: string
          maxLength: 2000
          description: 组织简介，须与 orgName 一起提供；仅当组织 intro 为空时写入
        categoryName:
          type: string
          maxLength: 64
          description: 过渡期便捷字段——按名称 get-or-create demand_category 并写入 categoryId
        description: { type: string }
        region: { type: string, maxLength: 64 }
        coopMode:
          type: array
          items: { type: string }
        budgetMinWan: { type: number }
        budgetMaxWan: { type: number }
        budgetNegotiable: { type: boolean }
        expectDeadline: { type: string, format: date }
        deadlineDesc: { type: string, maxLength: 128 }
        contactName: { type: string, maxLength: 64 }
        contactTitle: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        contactEmail: { type: string, maxLength: 128 }
        contactWechat: { type: string, maxLength: 64 }
        tags:
          type: array
          items: { type: string }
        attachmentFileIds:
          type: array
          items: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
    FavoriteItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/FavoriteTargetType' }
        targetId: { type: integer, format: int64 }
        favoritedAt: { type: string, format: date-time }
        achievement:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AchievementSummary'
        demand:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DemandSummary'
    CooperationIntent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        initiatorUserId: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/FavoriteTargetType' }
        targetId: { type: integer, format: int64 }
        targetOwnerUserId: { type: integer, format: int64 }
        message: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CooperationStatus' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time, description: 终态（rejected/cancelled）关闭时间 }
    CooperationIntentDetail:
      allOf:
        - $ref: '#/components/schemas/CooperationIntent'
        - type: object
          properties:
            counterpartDisplayName:
              type: [string, 'null']
              description: 对方展示名（取 user_profile.display_name，为 null 前端显示"未填写"）
            targetSummary:
              type: object
              properties:
                title: { type: string }
                orgName: { type: [string, 'null'] }
                status: { type: string }
    CooperationEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        intentId: { type: integer, format: int64 }
        eventType:
          type: string
          enum: [created, accepted, rejected, confirmed, cancelled, completed, auto_rejected]
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: string }
        operatorRole:
          type: string
          enum: [initiator, target_owner, admin, system]
        remark: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    MatchItem:
      type: object
      properties:
        achievementId: { type: integer, format: int64 }
        achievementTitle: { type: string }
        orgName: { type: [string, 'null'] }
        score: { type: number, minimum: 0, maximum: 100 }
        matchReasons:
          type: array
          items: { type: string }
        modelVersionLabel: { type: string }
    AchievementEvaluation:
      type: object
      description: 四维评分对齐演示版维度（技术特点/应用范围/成熟度/合作可行性）
      properties:
        id: { type: integer, format: int64 }
        achievementId: { type: integer, format: int64 }
        scoreTech: { type: number, minimum: 0, maximum: 100 }
        scoreApplication: { type: number, minimum: 0, maximum: 100 }
        scoreMaturity: { type: number, minimum: 0, maximum: 100 }
        scoreFeasibility: { type: number, minimum: 0, maximum: 100 }
        totalScore: { type: number, minimum: 0, maximum: 100 }
        summary: { type: [string, 'null'] }
        suggestions:
          type: array
          items: { type: string }
        modelVersionLabel: { type: string }
        inputDataVersion: { type: string }
        createdAt: { type: string, format: date-time }
    AsyncTaskCreated:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/AiTaskStatus' }
    MatchTaskResult:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/AiTaskStatus' }
        results:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/MatchItem'
        failReason: { type: [string, 'null'] }
        modelVersionLabel: { type: [string, 'null'] }
        inputDataVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    EvaluationTaskResult:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/AiTaskStatus' }
        evaluation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AchievementEvaluation'
        failReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    CapitalPlatform:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        platformType:
          type: string
          enum: [poc, pilot]
        supportUnit: { type: [string, 'null'] }
        functions: { type: [string, 'null'] }
        contactPerson: { type: [string, 'null'] }
        contactMobile: { type: [string, 'null'] }
        sourceSite: { type: [string, 'null'] }
    CapitalOrganization:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orgKind:
          type: string
          enum: [invest, financial, service]
        name: { type: string }
        intro: { type: [string, 'null'] }
        detailInfo: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        sortOrder: { type: integer }
    PatentSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        publicationNo: { type: string }
        title: { type: string }
        patentType: { $ref: '#/components/schemas/PatentType' }
        applicant: { type: [string, 'null'] }
        applyDate: { type: [string, 'null'], format: date }
        legalStatus: { $ref: '#/components/schemas/PatentLegalStatus' }
    PatentDetail:
      allOf:
        - $ref: '#/components/schemas/PatentSummary'
        - type: object
          properties:
            feeReducedLevel:
              type: string
              enum: [standard, reduce_70, reduce_85]
            annualFees:
              type: array
              description: 各年度年费（服务端费率规则计算，迁移自 patent-fee.js）
              items:
                type: object
                properties:
                  year: { type: integer }
                  feeWan: { type: number }
            latestPayDate: { type: [string, 'null'], format: date }
    UploadPresignResult:
      type: object
      properties:
        uploadId: { type: integer, format: int64 }
        uploadUrl: { type: string }
        uploadMethod: { type: string, enum: [PUT, POST] }
        expireAt: { type: string, format: date-time }
        headers:
          type: object
          additionalProperties: { type: string }
    UploadCompleteResult:
      type: object
      properties:
        fileId: { type: integer, format: int64 }
        url: { type: string }
    VersionRequest:
      type: object
      required: [version]
      description: 状态流转通用请求体（乐观锁）
      properties:
        version: { type: integer, minimum: 1 }
    AdminReviewAction:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 500 }
    AdminReviewReject:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    ReviewQueueItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        submitterDisplayName: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        version: { type: integer }
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: string }
        actorUserId: { type: [integer, 'null'], format: int64 }
        actorRole: { type: [string, 'null'] }
        action: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [integer, 'null'], format: int64 }
        createdAt: { type: string, format: date-time }
