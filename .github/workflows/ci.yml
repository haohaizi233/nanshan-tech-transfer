name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mac
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tech_transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      HOST_MODE: local
      AUTH_PROVIDER: mock
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: mac
      DB_PASSWORD: test
      DB_NAME: tech_transfer_test
      JWT_SECRET: ci-test-secret-key-for-github-actions-32chars!
      MEMBER_TEST_DSN: postgresql://mac:test@127.0.0.1:5432/tech_transfer_test
      PYTHONPATH: tech-transfer-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tech-transfer-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: tech-transfer-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 ruff mypy requests httpx2 python-dotenv pytest-asyncio

      - name: Run database migrations
        working-directory: tech-transfer-service
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: mac
          DB_PASSWORD: test
          DB_NAME: tech_transfer_test
        run: |
          python run_migration.py || echo "Migration skipped or failed (non-critical for unit tests)"

      - name: Run tests with coverage
        working-directory: tech-transfer-service
        run: |
          set +e
          pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=75 --tb=long -v --junit-xml=/tmp/junit.xml 2>&1 | tail -80
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: /tmp/junit.xml

      - name: Run nanshan-ai-agent tests
        working-directory: nanshan-ai-agent
        env:
          PYTHONPATH: .
          # app/config.py validate() fail-fast 要求 LLM 配置非空；
          # 测试全部 mock 网络调用，给占位值即可（真实值在本地 .env，不入库）
          LLM_API_URL: http://127.0.0.1:9
          LLM_API_KEY: ci-dummy-key
          LLM_MODEL: ci-dummy-model
        run: |
          python -m pytest -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            tech-transfer-service/coverage.xml
            tech-transfer-service/htmlcov/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: |
          pip install ruff mypy flake8

      - name: Run ruff (fast linter + formatter)
        working-directory: tech-transfer-service
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run mypy (type checking)
        working-directory: tech-transfer-service
        run: |
          mypy . --ignore-missing-imports --no-strict-optional --show-error-codes
        continue-on-error: true

      - name: Run flake8 (syntax errors)
        working-directory: tech-transfer-service
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  ruff-format:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Check code formatting
        working-directory: tech-transfer-service
        run: |
          ruff format --check --diff .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            南山小程序/南山/package-lock.json
            nanshan-frontend/package-lock.json
      - name: Install miniapp dependencies
        working-directory: 南山小程序/南山
        run: npm ci
      - name: Run miniapp regression tests
        working-directory: 南山小程序/南山
        run: node --test tests/*.test.mjs
      - name: Build H5 and WeChat miniapp
        working-directory: 南山小程序/南山
        env:
          UNI_INPUT_DIR: ${{ github.workspace }}/南山小程序/南山
        run: |
          npm run build:h5
          npm run build:mp-weixin
      - name: Build admin frontend
        working-directory: nanshan-frontend
        run: |
          npm ci
          npm run build
